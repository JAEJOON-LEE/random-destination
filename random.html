<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대한민국 룰렛 여행</title>

<style>
body {
  text-align:center;
  font-family:-apple-system;
  background:#111;
  color:white;
}

canvas {
  margin-top:20px;
}

button{
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:20px;
  background:#ffcc00;
  margin-top:20px;
}

#result{
  margin-top:20px;
  font-size:22px;
}

#mapWrapper{
  position:relative;
  margin:auto;
  margin-top:20px;
  width:350px;
}

#map{
  width:100%;
}

.marker{
  position:absolute;
  width:14px;
  height:14px;
  background:red;
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,0,0,0.7);}
  70%{box-shadow:0 0 0 15px rgba(255,0,0,0);}
  100%{box-shadow:0 0 0 0 rgba(255,0,0,0);}
}
</style>
</head>
<body>

<h1>🎡 대한민국 룰렛</h1>

<canvas id="wheel" width="320" height="320"></canvas>
<br>
<button onclick="spin()">돌리기</button>

<div id="result"></div>

<div id="mapWrapper">
  <img id="map" src="https://upload.wikimedia.org/wikipedia/commons/5/51/South_Korea_blank_map.svg">
</div>

<script>

// ===== 전체 지역 데이터 =====
const regions = {
"서울특별시":["종로구","중구","용산구","성동구","광진구","동대문구","중랑구","성북구","강북구","도봉구","노원구","은평구","서대문구","마포구","양천구","강서구","구로구","금천구","영등포구","동작구","관악구","서초구","강남구","송파구","강동구"],
"부산광역시":["중구","서구","동구","영도구","부산진구","동래구","남구","북구","해운대구","사하구","금정구","강서구","연제구","수영구","사상구","기장군"],
"대구광역시":["중구","동구","서구","남구","북구","수성구","달서구","달성군","군위군"],
"인천광역시":["중구","동구","미추홀구","연수구","남동구","부평구","계양구","서구","강화군","옹진군"],
"광주광역시":["동구","서구","남구","북구","광산구"],
"대전광역시":["동구","중구","서구","유성구","대덕구"],
"울산광역시":["중구","남구","동구","북구","울주군"],
"세종특별자치시":["세종특별자치시"],
"경기도":["수원시","성남시","의정부시","안양시","부천시","광명시","평택시","동두천시","안산시","고양시","과천시","구리시","남양주시","오산시","시흥시","군포시","의왕시","하남시","용인시","파주시","이천시","안성시","김포시","화성시","광주시","양주시","포천시","여주시","연천군","가평군","양평군"],
"강원특별자치도":["춘천시","원주시","강릉시","동해시","태백시","속초시","삼척시","홍천군","횡성군","영월군","평창군","정선군","철원군","화천군","양구군","인제군","고성군","양양군"],
"충청북도":["청주시","충주시","제천시","보은군","옥천군","영동군","증평군","진천군","괴산군","음성군","단양군"],
"충청남도":["천안시","공주시","보령시","아산시","서산시","논산시","계룡시","당진시","금산군","부여군","서천군","청양군","홍성군","예산군","태안군"],
"전북특별자치도":["전주시","군산시","익산시","정읍시","남원시","김제시","완주군","진안군","무주군","장수군","임실군","순창군","고창군","부안군"],
"전라남도":["목포시","여수시","순천시","나주시","광양시","담양군","곡성군","구례군","고흥군","보성군","화순군","장흥군","강진군","해남군","영암군","무안군","함평군","영광군","장성군","완도군","진도군","신안군"],
"경상북도":["포항시","경주시","김천시","안동시","구미시","영주시","영천시","상주시","문경시","경산시","군위군","의성군","청송군","영양군","영덕군","청도군","고령군","성주군","칠곡군","예천군","봉화군","울진군","울릉군"],
"경상남도":["창원시","진주시","통영시","사천시","김해시","밀양시","거제시","양산시","의령군","함안군","창녕군","고성군","남해군","하동군","산청군","함양군","거창군","합천군"],
"제주특별자치도":["제주시","서귀포시"]
};

// ===== 지도 좌표 (도 단위 중심 좌표 비율값) =====
const provinceCoords={
"서울특별시":[0.48,0.32],
"부산광역시":[0.63,0.75],
"대구광역시":[0.58,0.65],
"인천광역시":[0.43,0.32],
"광주광역시":[0.42,0.70],
"대전광역시":[0.50,0.55],
"울산광역시":[0.66,0.67],
"세종특별자치시":[0.50,0.50],
"경기도":[0.48,0.35],
"강원특별자치도":[0.63,0.35],
"충청북도":[0.55,0.52],
"충청남도":[0.45,0.55],
"전북특별자치도":[0.42,0.63],
"전라남도":[0.40,0.75],
"경상북도":[0.65,0.50],
"경상남도":[0.60,0.72],
"제주특별자치도":[0.48,0.92]
};

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
let angle=0;
let spinning=false;
const provinces=Object.keys(regions);

function drawWheel(){
  const arc=2*Math.PI/provinces.length;
  provinces.forEach((p,i)=>{
    ctx.beginPath();
    ctx.fillStyle=`hsl(${i*20},70%,50%)`;
    ctx.moveTo(160,160);
    ctx.arc(160,160,150,angle+i*arc,angle+(i+1)*arc);
    ctx.fill();
    ctx.save();
    ctx.translate(160,160);
    ctx.rotate(angle+i*arc+arc/2);
    ctx.fillStyle="white";
    ctx.fillText(p,80,5);
    ctx.restore();
  });
}

function spin(){
 if(spinning)return;
 spinning=true;
 let speed=0.3;
 let duration=3000;
 let start=Date.now();

 function animate(){
  let now=Date.now();
  let elapsed=now-start;
  if(elapsed<duration){
    angle+=speed;
    speed*=0.99;
    ctx.clearRect(0,0,320,320);
    drawWheel();
    requestAnimationFrame(animate);
  }else{
    spinning=false;
    selectResult();
  }
 }
 animate();
}

function selectResult(){
 let index=Math.floor((2*Math.PI-angle%(2*Math.PI))/(2*Math.PI)*provinces.length)%provinces.length;
 let province=provinces[index];
 let cities=regions[province];
 let city=cities[Math.floor(Math.random()*cities.length)];
 document.getElementById("result").innerHTML=`📍 ${province} - ${city}`;
 showMarker(province);
}

function showMarker(province){
 document.querySelectorAll(".marker").forEach(m=>m.remove());
 const coords=provinceCoords[province];
 const map=document.getElementById("map");
 const marker=document.createElement("div");
 marker.className="marker";
 marker.style.left=(coords[0]*map.clientWidth)+"px";
 marker.style.top=(coords[1]*map.clientHeight)+"px";
 document.getElementById("mapWrapper").appendChild(marker);
}

drawWheel();

</script>
</body>
</html>
