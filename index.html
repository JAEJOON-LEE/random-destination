<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>재준 지용 규택 승준 레츠고</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
html, body {
  height:100%;
  margin:0;
  overflow:hidden;
}

body {
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#1e2a38;
  color:white;
  text-align:center;
  display:flex;
  flex-direction:column;
  height:100vh;
  padding:8px;
  box-sizing:border-box;
}

h2 { margin:5px 0; font-size:5vw; }

button {
  padding:10px;
  font-size:4vw;
  border:none;
  border-radius:12px;
  margin:5px auto;
  cursor:pointer;
  background:#ff6347;
  color:white;
  width:80%;
  max-width:300px;
}

#options {
  flex:1;
  display:grid;
  gap:3px;
  align-content:stretch;
  justify-content:stretch;
  overflow:hidden;
  min-height:0;
}

.option {
  background:#333;
  border-radius:6px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:2px;
  overflow:hidden;
  word-break:keep-all;
  line-height:1;
}

.option.highlight {
  animation: blinkRoulette 0.4s infinite;
}

@keyframes blinkRoulette {
  0% { color: #ffd700; transform: scale(1.1); }
  50% { color: #ff4d4d; transform: scale(1.2); }
  100% { color: #ffd700; transform: scale(1.1); }
}

/* ===== 팝업 ===== */

#overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(6px);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.3s ease;
}

#overlay.show {
  opacity:1;
  pointer-events:auto;
}

#popup {
  background:#222;
  padding:30px 20px;
  border-radius:20px;
  text-align:center;
  animation:popupAnim 0.6s ease;
  box-shadow:0 0 30px rgba(255,215,0,0.6);
}

#popup h3 {
  margin:0 0 10px;
  font-size:5vw;
  color:#ffd700;
}

#popup p {
  margin:0;
  font-size:8vw;
  font-weight:bold;
}

@keyframes popupAnim {
  0% { transform:scale(0.5); opacity:0; }
  60% { transform:scale(1.1); }
  100% { transform:scale(1); opacity:1; }
}
</style>
</head>
<body>

<h2>🗺️🚘🍻🥩</h2>
<button id="selectBtn">🎯 지역 선택</button>
<div id="options"></div>

<div id="overlay">
  <div id="popup">
    <h3>🎉 최종 선택 🎉</h3>
    <p id="popupText"></p>
  </div>
</div>

<audio id="winSound" preload="auto">
  <source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" type="audio/ogg">
</audio>

<script>
const regions = {
  "서울특별시":["종로구","중구","용산구","성동구","광진구","동대문구","중랑구","성북구","강북구","도봉구","노원구","은평구","서대문구","마포구","양천구","강서구","구로구","금천구","영등포구","동작구","관악구","서초구","강남구","송파구","강동구"],
  "부산광역시":["중구","서구","동구","영도구","부산진구","동래구","남구","북구","해운대구","사하구","금정구","연제구","수영구","사상구","기장군"],
  "대구광역시":["중구","동구","서구","남구","북구","수성구","달서구","달성군"],
  "인천광역시":["중구","동구","미추홀구","연수구","남동구","부평구","계양구","서구","강화군","옹진군"],
  "광주광역시":["동구","서구","남구","북구","광산구"],
  "대전광역시":["동구","중구","서구","유성구","대덕구"],
  "울산광역시":["중구","남구","동구","북구","울주군"],
  "세종특별자치시":["세종특별자치시"],
  "경기도":["수원시","성남시","의정부시","안양시","부천시","광명시","평택시","동두천시","안산시","고양시","과천시","구리시","남양주시","오산시","시흥시","군포시","의왕시","하남시","용인시","파주시","이천시","안성시","김포시","화성시","광주시","양주시","포천시","여주시","연천군","가평군","양평군"],
  "강원특별자치도":["춘천시","원주시","강릉시","동해시","속초시","삼척시","홍천군","횡성군","영월군","평창군","정선군","철원군","화천군","양구군","인제군","고성군","양양군"],
  "충청북도":["청주시","충주시","제천시","보은군","옥천군","영동군","증평군","진천군","괴산군","음성군","단양군"],
  "충청남도":["천안시","공주시","보령시","아산시","서산시","논산시","계룡시","당진시","금산군","부여군","서천군","청양군","홍성군","예산군","태안군"],
  "전라북도":["전주시","군산시","익산시","정읍시","남원시","김제시","완주군","진안군","무주군","장수군","임실군","순창군","고창군","부안군"],
  "전라남도":["목포시","여수시","순천시","나주시","광양시","담양군","곡성군","구례군","고흥군","보성군","화순군","장흥군","강진군","해남군","영암군","무안군","함평군","영광군","장성군","완도군","진도군","신안군"],
  "경상북도":["포항시","경주시","김천시","안동시","구미시","영주시","영천시","상주시","문경시","경산시","군위군","의성군","청송군","영양군","영덕군","청도군","고령군","성주군","칠곡군","예천군","봉화군","울진군","울릉군"],
  "경상남도":["창원시","진주시","통영시","사천시","김해시","밀양시","거제시","양산시","의령군","함안군","창녕군","고성군","남해군","하동군","산청군","함양군","거창군","합천군"],
  "제주특별자치도":["제주시","서귀포시"]
};

let phase="province";
let selectedProvince="";
let animationInterval=null;

function autoLayout(count){
  const options=document.getElementById("options");
  const h=options.clientHeight;
  const w=options.clientWidth;

  let cols=Math.ceil(Math.sqrt(count));
  const rows=Math.ceil(count/cols);

  options.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  options.style.gridTemplateRows=`repeat(${rows},1fr)`;

  const fontSize=Math.max(6,Math.floor((h/rows)*0.3));
  document.querySelectorAll(".option").forEach(o=>{
    o.style.fontSize=fontSize+"px";
  });
}

function showOptions(list){
  const container=document.getElementById("options");
  container.innerHTML="";
  list.forEach(item=>{
    const div=document.createElement("div");
    div.className="option";
    div.innerText=item;
    container.appendChild(div);
  });
  requestAnimationFrame(()=>autoLayout(list.length));
}

function runRoulette(list,callback){
  const optionDivs=document.querySelectorAll(".option");
  let currentIndex=0;
  const total=optionDivs.length;
  clearInterval(animationInterval);

  animationInterval=setInterval(()=>{
    optionDivs.forEach(d=>d.classList.remove("highlight"));
    optionDivs[currentIndex].classList.add("highlight");
    currentIndex=(currentIndex+1)%total;
  },50);

  const duration=1500+Math.random()*1000;
  setTimeout(()=>{
    clearInterval(animationInterval);
    const finalIndex=Math.floor(Math.random()*total);
    optionDivs.forEach(d=>d.classList.remove("highlight"));
    optionDivs[finalIndex].classList.add("highlight");
    callback(list[finalIndex]);
  },duration);
}

function showPopup(text){
  document.getElementById("popupText").innerText=text;
  document.getElementById("overlay").classList.add("show");
  document.getElementById("winSound").play().catch(()=>{});
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}

document.getElementById("overlay").addEventListener("click",()=>{
  document.getElementById("overlay").classList.remove("show");
});

document.getElementById("selectBtn").addEventListener("click",()=>{
  const btn=document.getElementById("selectBtn");

  if(phase==="province"){
    const provinces=Object.keys(regions);
    showOptions(provinces);
    runRoulette(provinces,(selected)=>{
      selectedProvince=selected;
      btn.innerText=selectedProvince+" 지역 선택";
      phase="city";
    });
  } else {
    const cities=regions[selectedProvince];
    showOptions(cities);
    runRoulette(cities,(selected)=>{
      btn.innerText="🎯 지역 선택";
      showPopup(selectedProvince+" → "+selected);
      phase="province";
      selectedProvince="";
    });
  }
});
</script>

</body>
</html>
