<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>여행지 랜덤 게임</title>
<style>
body {
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#1e2a38;
  color:white;
  text-align:center;
  padding:20px;
}
button {
  padding:12px 25px;
  font-size:16px;
  border:none;
  border-radius:12px;
  margin:15px;
  cursor:pointer;
  background:#ff6347;
  color:white;
}
#options {
  margin-top:20px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}
.option {
  padding:8px 12px;
  border-radius:8px;
  background:#333;
  transition: transform 0.2s, color 0.2s;
  cursor:default;
}

/* 룰렛 깜빡임 강조 */
.option.highlight {
  animation: blinkRoulette 0.5s infinite;
}

/* 깜빡임 빨강 → 노랑 → 흰색 */
@keyframes blinkRoulette {
  0% { color: #ffd700; transform: scale(1.2); }
  50% { color: #ff4d4d; transform: scale(1.4); }
  100% { color: #ffd700; transform: scale(1.2); }
}

/* 최종 선택 깜빡임 + 흔들림 + 확대/축소 */
#finalResult {
  margin-top:20px;
  font-size:24px;
  font-weight:bold;
  color:#ffd700;
}

@keyframes finalHighlight {
  0% { transform: scale(1) rotate(0deg); opacity:1; }
  10% { transform: scale(1.3) rotate(-5deg); opacity:0.8; }
  20% { transform: scale(1.3) rotate(5deg); opacity:1; }
  30% { transform: scale(1.3) rotate(-3deg); opacity:0.8; }
  40% { transform: scale(1.3) rotate(3deg); opacity:1; }
  50% { transform: scale(1.4) rotate(0deg); opacity:1; }
  60% { transform: scale(1.2) rotate(-5deg); opacity:0.9; }
  70% { transform: scale(1.3) rotate(5deg); opacity:1; }
  80% { transform: scale(1.2) rotate(-3deg); opacity:0.9; }
  90% { transform: scale(1.3) rotate(3deg); opacity:1; }
  100% { transform: scale(1) rotate(0deg); opacity:1; }
}

#finalResult.highlight {
  animation: finalHighlight 1.5s ease-in-out forwards;
}
</style>
</head>
<body>

<h2>재준 지용 규택 승준 레츠고</h2>
<button id="selectBtn">🎯 지역 선택</button>
<div id="options"></div>
<div id="finalResult"></div>

<script>
// ------------------ 대한민국 시·도 + 시·군·구 전체 ------------------
const regions = {
  "서울특별시":["종로구","중구","용산구","성동구","광진구","동대문구","중랑구","성북구","강북구","도봉구","노원구","은평구","서대문구","마포구","양천구","강서구","구로구","금천구","영등포구","동작구","관악구","서초구","강남구","송파구","강동구"],
  "부산광역시":["중구","서구","동구","영도구","부산진구","동래구","남구","북구","해운대구","사하구","금정구","연제구","수영구","사상구","기장군"],
  "대구광역시":["중구","동구","서구","남구","북구","수성구","달서구","달성군"],
  "인천광역시":["중구","동구","미추홀구","연수구","남동구","부평구","계양구","서구","강화군","옹진군"],
  "광주광역시":["동구","서구","남구","북구","광산구"],
  "대전광역시":["동구","중구","서구","유성구","대덕구"],
  "울산광역시":["중구","남구","동구","북구","울주군"],
  "세종특별자치시":["세종특별자치시"],
  "경기도":["수원시","성남시","의정부시","안양시","부천시","광명시","평택시","동두천시","안산시","고양시","과천시","구리시","남양주시","오산시","시흥시","군포시","의왕시","하남시","용인시","파주시","이천시","안성시","김포시","화성시","광주시","양주시","포천시","여주시","연천군","가평군","양평군"],
  "강원특별자치도":["춘천시","원주시","강릉시","동해시","속초시","삼척시","홍천군","횡성군","영월군","평창군","정선군","철원군","화천군","양구군","인제군","고성군","양양군"],
  "충청북도":["청주시","충주시","제천시","보은군","옥천군","영동군","증평군","진천군","괴산군","음성군","단양군"],
  "충청남도":["천안시","공주시","보령시","아산시","서산시","논산시","계룡시","당진시","금산군","부여군","서천군","청양군","홍성군","예산군","태안군"],
  "전라북도":["전주시","군산시","익산시","정읍시","남원시","김제시","완주군","진안군","무주군","장수군","임실군","순창군","고창군","부안군"],
  "전라남도":["목포시","여수시","순천시","나주시","광양시","담양군","곡성군","구례군","고흥군","보성군","화순군","장흥군","강진군","해남군","영암군","무안군","함평군","영광군","장성군","완도군","진도군","신안군"],
  "경상북도":["포항시","경주시","김천시","안동시","구미시","영주시","영천시","상주시","문경시","경산시","군위군","의성군","청송군","영양군","영덕군","청도군","고령군","성주군","칠곡군","예천군","봉화군","울진군","울릉군"],
  "경상남도":["창원시","진주시","통영시","사천시","김해시","밀양시","거제시","양산시","의령군","함안군","창녕군","고성군","남해군","하동군","산청군","함양군","거창군","합천군"],
  "제주특별자치도":["제주시","서귀포시"]
};

let phase = "province";
let selectedProvince = "";
let animationInterval = null;

function showOptions(list){
  const container = document.getElementById("options");
  container.innerHTML = "";
  list.forEach(item=>{
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = item;
    container.appendChild(div);
  });
}

function runRoulette(list, callback){
  const optionDivs = document.querySelectorAll(".option");
  let currentIndex = 0;
  const total = optionDivs.length;
  clearInterval(animationInterval);

  animationInterval = setInterval(()=>{
    optionDivs.forEach(d=>d.classList.remove("highlight"));
    optionDivs[currentIndex].classList.add("highlight");
    currentIndex = (currentIndex+1)%total;
  },50);

  const duration = 1500 + Math.random()*1000;
  setTimeout(()=>{
    clearInterval(animationInterval);
    const finalIndex = Math.floor(Math.random()*total);
    optionDivs.forEach(d=>d.classList.remove("highlight"));
    optionDivs[finalIndex].classList.add("highlight");
    callback(list[finalIndex]);
  },duration);
}

document.getElementById("selectBtn").addEventListener("click", ()=>{
  const btn = document.getElementById("selectBtn");
  const finalResult = document.getElementById("finalResult");
  finalResult.classList.remove("highlight");
  finalResult.innerText = "";

  if(phase==="province"){
    const provinces = Object.keys(regions);
    showOptions(provinces);
    runRoulette(provinces,(selected)=>{
      selectedProvince = selected;
      btn.innerText = selectedProvince+" 지역 선택";
      phase="city";
    });
  } else if(phase==="city"){
    const cities = regions[selectedProvince];
    showOptions(cities);
    runRoulette(cities,(selected)=>{
      const container = document.getElementById("options");
      container.querySelectorAll(".option").forEach(d=>{
        d.classList.remove("highlight");
        if(d.innerText===selected) d.classList.add("highlight");
      });
      btn.innerText = "🎯 지역 선택";
      finalResult.innerText = "최종 선택: "+selectedProvince+" → "+selected;
      finalResult.classList.add("highlight");
      phase="province";
      selectedProvince = "";
    });
  }
});
</script>

</body>
</html>
