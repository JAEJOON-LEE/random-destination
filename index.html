<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>재준 지용 규택 승준 레츠고</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
html, body {
  height:100%;
  overflow:hidden;
  margin:0;
}

body {
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#1e2a38;
  color:white;
  text-align:center;
  display:flex;
  flex-direction:column;
  height:100vh;
  padding:10px;
}

h2 {
  margin:5px 0;
  font-size:5vw;
}

button {
  padding:10px;
  font-size:4vw;
  border:none;
  border-radius:12px;
  margin:5px auto;
  cursor:pointer;
  background:#ff6347;
  color:white;
  width:80%;
  max-width:300px;
}

#options {
  flex:1;
  display:grid;
  gap:6px;
  align-content:center;
}

.option {
  padding:6px;
  border-radius:8px;
  background:#333;
  transition: transform 0.2s, color 0.2s;
  display:flex;
  justify-content:center;
  align-items:center;
}

.option.highlight {
  animation: blinkRoulette 0.4s infinite;
}

@keyframes blinkRoulette {
  0% { color: #ffd700; transform: scale(1.2); }
  50% { color: #ff4d4d; transform: scale(1.3); }
  100% { color: #ffd700; transform: scale(1.2); }
}

#finalResult {
  font-weight:bold;
  color:#ffd700;
  font-size:5vw;
  min-height:6vh;
}

#finalResult.highlight {
  animation: finalHighlight 1.2s ease-in-out forwards;
}

@keyframes finalHighlight {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
</style>
</head>
<body>

<h2>🗺️🚘🍻🥩</h2>
<button id="selectBtn">🎯 지역 선택</button>
<div id="options"></div>
<div id="finalResult"></div>

<script>
const regions = { /* 👉 기존 regions 그대로 넣으면 됨 */ };

let phase = "province";
let selectedProvince = "";
let animationInterval = null;

function autoLayout(count){
  const options = document.getElementById("options");

  let columns = 3;
  if(count > 30) columns = 6;
  else if(count > 20) columns = 5;
  else if(count > 12) columns = 4;
  else if(count > 6) columns = 3;
  else columns = 2;

  options.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;

  let fontSize = 18;
  if(count > 30) fontSize = 10;
  else if(count > 20) fontSize = 12;
  else if(count > 12) fontSize = 14;
  else if(count > 6) fontSize = 16;

  document.querySelectorAll(".option").forEach(o=>{
    o.style.fontSize = fontSize+"px";
  });
}

function showOptions(list){
  const container = document.getElementById("options");
  container.innerHTML = "";

  list.forEach(item=>{
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = item;
    container.appendChild(div);
  });

  autoLayout(list.length);
}

function runRoulette(list, callback){
  const optionDivs = document.querySelectorAll(".option");
  let currentIndex = 0;
  const total = optionDivs.length;
  clearInterval(animationInterval);

  animationInterval = setInterval(()=>{
    optionDivs.forEach(d=>d.classList.remove("highlight"));
    optionDivs[currentIndex].classList.add("highlight");
    currentIndex = (currentIndex+1)%total;
  },50);

  const duration = 1500 + Math.random()*1000;
  setTimeout(()=>{
    clearInterval(animationInterval);
    const finalIndex = Math.floor(Math.random()*total);
    optionDivs.forEach(d=>d.classList.remove("highlight"));
    optionDivs[finalIndex].classList.add("highlight");
    callback(list[finalIndex]);
  },duration);
}

document.getElementById("selectBtn").addEventListener("click", ()=>{
  const btn = document.getElementById("selectBtn");
  const finalResult = document.getElementById("finalResult");
  finalResult.classList.remove("highlight");
  finalResult.innerText = "";

  if(phase==="province"){
    const provinces = Object.keys(regions);
    showOptions(provinces);
    runRoulette(provinces,(selected)=>{
      selectedProvince = selected;
      btn.innerText = selectedProvince+" 지역 선택";
      phase="city";
    });
  } else {
    const cities = regions[selectedProvince];
    showOptions(cities);
    runRoulette(cities,(selected)=>{
      btn.innerText = "🎯 지역 선택";
      finalResult.innerText = "최종 선택: "+selectedProvince+" → "+selected;
      finalResult.classList.add("highlight");
      phase="province";
      selectedProvince="";
    });
  }
});
</script>

</body>
</html>
