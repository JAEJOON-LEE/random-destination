<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>재준 지용 규택 승준 레츠고</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
html, body {
  height:100%;
  margin:0;
  overflow:hidden;
}

body {
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#1e2a38;
  color:white;
  text-align:center;
  display:flex;
  flex-direction:column;
  height:100vh;
  padding:8px;
  box-sizing:border-box;
}

h2 { margin:5px 0; font-size:5vw; }

button {
  padding:10px;
  font-size:4vw;
  border:none;
  border-radius:12px;
  margin:5px auto;
  cursor:pointer;
  background:#ff6347;
  color:white;
  width:80%;
  max-width:300px;
}

#options {
  flex:1;
  display:grid;
  gap:3px;
  align-content:stretch;
  justify-content:stretch;
  overflow:hidden;
  min-height:0;
}

.option {
  background:#333;
  border-radius:6px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:2px;
  overflow:hidden;
  word-break:keep-all;
  line-height:1;
}

.option.highlight {
  animation: blinkRoulette 0.4s infinite;
}

@keyframes blinkRoulette {
  0% { color: #ffd700; transform: scale(1.1); }
  50% { color: #ff4d4d; transform: scale(1.2); }
  100% { color: #ffd700; transform: scale(1.1); }
}

/* ===== 팝업 오버레이 ===== */

#overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(6px);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.3s ease;
}

#overlay.show {
  opacity:1;
  pointer-events:auto;
}

#popup {
  background:#222;
  padding:30px 20px;
  border-radius:20px;
  text-align:center;
  animation:popupAnim 0.6s ease;
  box-shadow:0 0 30px rgba(255,215,0,0.6);
}

#popup h3 {
  margin:0 0 10px;
  font-size:5vw;
  color:#ffd700;
}

#popup p {
  margin:0;
  font-size:8vw;
  font-weight:bold;
}

@keyframes popupAnim {
  0% { transform:scale(0.5); opacity:0; }
  60% { transform:scale(1.1); }
  100% { transform:scale(1); opacity:1; }
}
</style>
</head>
<body>

<h2>🗺️🚘🍻🥩</h2>
<button id="selectBtn">🎯 지역 선택</button>
<div id="options"></div>

<!-- 팝업 -->
<div id="overlay">
  <div id="popup">
    <h3>🎉 최종 선택 🎉</h3>
    <p id="popupText"></p>
  </div>
</div>

<!-- 효과음 -->
<audio id="winSound" preload="auto">
  <source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" type="audio/ogg">
</audio>

<script>
const regions = {
  "서울특별시":["종로구","중구","용산구","성동구","광진구","동대문구","중랑구","성북구","강북구","도봉구","노원구","은평구","서대문구","마포구","양천구","강서구","구로구","금천구","영등포구","동작구","관악구","서초구","강남구","송파구","강동구"],
  "경상북도":["포항시","경주시","김천시","안동시","구미시","영주시","영천시","상주시","문경시","경산시","군위군","의성군","청송군","영양군","영덕군","청도군","고령군","성주군","칠곡군","예천군","봉화군","울진군","울릉군"]
  // 👉 필요하면 나머지 도도 다시 넣으면 됨
};

let phase = "province";
let selectedProvince = "";
let animationInterval = null;

function autoLayout(count){
  const options = document.getElementById("options");
  const height = options.clientHeight;
  const width = options.clientWidth;

  let cols = Math.ceil(Math.sqrt(count));
  const rows = Math.ceil(count / cols);

  options.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  options.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

  const cellHeight = height / rows;
  const fontSize = Math.max(6, Math.floor(cellHeight * 0.3));

  document.querySelectorAll(".option").forEach(o=>{
    o.style.fontSize = fontSize + "px";
  });
}

function showOptions(list){
  const container = document.getElementById("options");
  container.innerHTML = "";

  list.forEach(item=>{
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = item;
    container.appendChild(div);
  });

  requestAnimationFrame(()=> autoLayout(list.length));
}

function runRoulette(list, callback){
  const optionDivs = document.querySelectorAll(".option");
  let currentIndex = 0;
  const total = optionDivs.length;
  clearInterval(animationInterval);

  animationInterval = setInterval(()=>{
    optionDivs.forEach(d=>d.classList.remove("highlight"));
    optionDivs[currentIndex].classList.add("highlight");
    currentIndex = (currentIndex+1)%total;
  },50);

  const duration = 1500 + Math.random()*1000;
  setTimeout(()=>{
    clearInterval(animationInterval);
    const finalIndex = Math.floor(Math.random()*total);
    optionDivs.forEach(d=>d.classList.remove("highlight"));
    optionDivs[finalIndex].classList.add("highlight");
    callback(list[finalIndex]);
  },duration);
}

function showPopup(text){
  document.getElementById("popupText").innerText = text;
  document.getElementById("overlay").classList.add("show");

  // 🔊 효과음
  document.getElementById("winSound").play().catch(()=>{});

  // 📳 진동 (지원 기기만)
  if(navigator.vibrate){
    navigator.vibrate([200,100,200]);
  }
}

document.getElementById("overlay").addEventListener("click", ()=>{
  document.getElementById("overlay").classList.remove("show");
});

document.getElementById("selectBtn").addEventListener("click", ()=>{
  const btn = document.getElementById("selectBtn");

  if(phase==="province"){
    const provinces = Object.keys(regions);
    showOptions(provinces);
    runRoulette(provinces,(selected)=>{
      selectedProvince = selected;
      btn.innerText = selectedProvince+" 지역 선택";
      phase="city";
    });
  } else {
    const cities = regions[selectedProvince];
    showOptions(cities);
    runRoulette(cities,(selected)=>{
      btn.innerText = "🎯 지역 선택";
      showPopup(selectedProvince+" → "+selected);
      phase="province";
      selectedProvince="";
    });
  }
});
</script>

</body>
</html>
